name: Build Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v1.0.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
            artifact: release-windows-x64
          - os: ubuntu-22.04
            label: Linux x64
            artifact: release-linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --disable-pip-version-check --no-cache-dir pyinstaller==6.21.0

      - name: Build executable
        run: python -m PyInstaller --clean --noconfirm --onefile --name redmagic-auto-sign redmagic_auto_sign.py

      - name: Smoke test
        shell: pwsh
        run: |
          $env:REDMAGIC_ACCESS_TOKEN = "release-smoke-test-token"
          $env:REDMAGIC_PUSH_DISABLED = "true"
          if ($IsWindows) {
            & .\dist\redmagic-auto-sign.exe --dry-run
          } else {
            & ./dist/redmagic-auto-sign --dry-run
          }

      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $archive = "redmagic-auto-sign-windows-x64.zip"
          Compress-Archive -Path "dist/redmagic-auto-sign.exe" -DestinationPath "release/$archive"
          $hash = (Get-FileHash "release/$archive" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content "release/$archive.sha256" -Encoding ascii -NoNewline

      - name: Package Linux executable
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p release
          chmod +x dist/redmagic-auto-sign
          tar -C dist -czf release/redmagic-auto-sign-linux-x64.tar.gz redmagic-auto-sign
          cd release
          sha256sum redmagic-auto-sign-linux-x64.tar.gz > redmagic-auto-sign-linux-x64.tar.gz.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: release/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Resolve release tag
        id: release-tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="$INPUT_TAG"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* \
              --target "$GITHUB_SHA" \
              --title "RedMagic Auto Sign $RELEASE_TAG" \
              --generate-notes
          fi
