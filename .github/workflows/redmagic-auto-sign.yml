name: RedMagic Auto Sign

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate token config but skip daily tasks
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "10 0,8,16 * * *"

jobs:
  redmagic-auto-sign:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Shanghai
      REDMAGIC_ACCESS_TOKEN: ${{ secrets.REDMAGIC_ACCESS_TOKEN }}
      REDMAGIC_ACCESS_TOKENS: ${{ secrets.REDMAGIC_ACCESS_TOKENS }}
      REDMAGIC_ACCOUNTS: ${{ secrets.REDMAGIC_ACCOUNTS }}
      REDMAGIC_DRY_RUN: ${{ inputs.dry_run }}
      REDMAGIC_ENABLE_BOX: ${{ vars.REDMAGIC_ENABLE_BOX || 'false' }}
      REDMAGIC_ENABLE_LOTTERY: ${{ vars.REDMAGIC_ENABLE_LOTTERY || 'true' }}
      REDMAGIC_LOTTERY_TIMES: ${{ vars.REDMAGIC_LOTTERY_TIMES || '10' }}
      REDMAGIC_LOTTERY_DELAY: ${{ vars.REDMAGIC_LOTTERY_DELAY || '1.5' }}
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      PUSH_PLUS_TOKEN: ${{ secrets.PUSH_PLUS_TOKEN }}
      SCT_KEY: ${{ secrets.SCT_KEY }}
      SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
      BARK_KEY: ${{ secrets.BARK_KEY }}
      BARK_URL: ${{ secrets.BARK_URL }}
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_USER_ID: ${{ secrets.TG_USER_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      REDMAGIC_WEBHOOK_URL: ${{ secrets.REDMAGIC_WEBHOOK_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run RedMagic tasks
        run: python redmagic_auto_sign.py
